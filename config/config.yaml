# SSH Defense Gateway - Default Configuration
# All thresholds and behavior for the intrusion defender.

# Maximum failed login attempts before a source IP is flagged.
max_attempts: 5

# Time window (seconds) in which failed attempts are counted.
time_window_seconds: 300

# How long (minutes) a flagged IP is blocked.
block_duration_minutes: 15

# How often (seconds) the daemon re-scans live sessions with the AI
# behavioral detector. Optional: when absent the daemon defaults to 30.
behavior_scan_interval_seconds: 30

# Commands considered suspicious when observed during a session.
suspicious_commands:
  - sudo
  - apt
  - python3

# Optional ML anomaly-tuning knobs (the isolation forest detector).
# Loading is backwards-compatible: when these keys are absent the defaults
# below are used.
# anomaly_enabled: true
# anomaly_threshold: 0.72         # 0-1 ML outlier score required to respond
# anomaly_forest_trees: 16        # trees in the isolation forest
# anomaly_max_memory: 150         # rolling per-user feature vectors retained
# anomaly_min_train: 25           # sessions before the baseline is usable
# anomaly_retrain_every: 24       # new sessions before the forest refits

# IP addresses or CIDR networks that must never be blocked or terminated,
# so the defender cannot lock itself out during its own response.
whitelist_ips:
  - 127.0.0.1
  - 192.168.0.0/16

# Optional behavior-baseline knobs used by AI training mode (--train).
# baseline_min_samples: 5     # per-user sessions before the profile yields a score
# baseline_z_threshold: 2.5   # max |z| across features that flags a session

# Session audit storage: every SSH session the scanner sees is recorded as
# a JSONL line in log_dir AND as a row in the SQLite file, so you can later
# query who logged in from where and which commands they ran.
session_audit:
  enabled: true
  log_dir: logs/sessions
  sqlite_path: logs/sessions.db
  retention_days: 30

# Phone push notifications through ntfy.sh (free, no account needed).
# Set ntfy_topic to a long, unguessable string and subscribe to it in the
# free ntfy app on your phone; alerts then land there instantly.
notifier:
  enabled: true
  ntfy_url: https://ntfy.sh
  ntfy_topic: ""

# Active lockdown applied to a flagged session's account. Password rotation
# is only possible once gpg_recipient holds your GPG public key fingerprint;
# the new password is encrypted to that key and only then pushed to your
# phone. Password-auth disabling requires root and key-based login to keep.
hardening:
  rotate_password_on_threat: true
  gpg_recipient: ""
  disable_password_auth_on_threat: false
  sshd_config_path: /etc/ssh/sshd_config
